<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>

  <style>
    body { font-family: sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem; color: #000; background: #fff; }
    h1 { margin: 0; font-size: 1.75rem; }
    h2 { margin: 1.5rem 0 .5rem; font-size: 1.1rem; }
    .top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .search h2 { margin: 0 0 .25rem; font-size: 1rem; }
    .list-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 1.5rem 0 .5rem; }
    .list-head h2, #total { margin: 0; }
    #total { font-size: 1.1rem; font-weight: bold; }
    form { display: grid; grid-template-columns: 2fr 1.2fr 1fr minmax(11rem, 1.4fr) auto; gap: .5rem; }
    #search-form { display: flex; }
    #search-form input { width: 8rem; }
    input, button { padding: .5rem; font-size: 1rem; font-family: inherit; color: #000; background: #fff; border: 1px solid #000; border-radius: 0; min-width: 0; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #000; }
    .error { min-height: 1.2rem; margin: .5rem 0; }
    @media (max-width: 600px) { form:not(#search-form) { grid-template-columns: 1fr 1fr; } }
  </style>
  
</head>
<body>
  <header class="top">
    <h1>Expense Tracker</h1>
    <div class="search">
      <h2>Find Expense by ID</h2>
      <form id="search-form">
        <input id="search-id" type="number" min="1" placeholder="Expense ID" required>
        <button type="submit">Search</button>
        <button type="button" id="clear-search">Clear</button>
      </form>
    </div>
  </header>
  <div id="search-error" class="error"></div>
  <table id="search-result" hidden>
    <thead><tr><th>ID</th><th>Description</th><th>Category</th><th>Amount</th><th>Date</th><th></th></tr></thead>
    <tbody id="search-rows"></tbody>
  </table>

  <h2>Add Expense</h2>
  <form id="form">
    <input name="description" placeholder="Description" required>
    <input name="category" placeholder="Category" required>
    <input name="amount" type="number" step="0.01" placeholder="Amount" required>
    <input name="date" type="date">
    <button type="submit">Add</button>
  </form>
  <div id="error" class="error"></div>

  <div class="list-head">
    <h2>All Expenses</h2>
    <div id="total">Total: 0.00</div>
  </div>
  <table>
    <thead><tr><th>ID</th><th>Description</th><th>Category</th><th>Amount</th><th>Date</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const rows = document.getElementById('rows');
    const totalEl = document.getElementById('total');
    const errorEl = document.getElementById('error');
    const searchError = document.getElementById('search-error');
    const searchTable = document.getElementById('search-result');
    const searchRows = document.getElementById('search-rows');

    function buildRow(e) {
      const tr = document.createElement('tr');
      for (const v of [e.id, e.description, e.category, e.amount.toFixed(2), e.date]) {
        const td = document.createElement('td');
        if (v === e.category) {
          const pill = document.createElement('span');
          pill.className = 'pill';
          pill.textContent = v;
          td.appendChild(pill);
        } else {
          td.textContent = v;
        }
        tr.appendChild(td);
      }
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'delete';
      btn.textContent = 'Delete';
      btn.onclick = () => deleteExpense(e.id);
      td.appendChild(btn);
      tr.appendChild(td);
      return tr;
    }

    function render({ expenses, total }) {
      rows.innerHTML = '';
      expenses.forEach((e) => rows.appendChild(buildRow(e)));
      totalEl.textContent = 'Total: ' + total.toFixed(2);
    }

    async function load() {
      const res = await fetch('/api/expenses');
      render(await res.json());
    }

    async function deleteExpense(id) {
      const res = await fetch('/api/expenses/' + id, { method: 'DELETE' });
      if (!res.ok) {
        errorEl.textContent = (await res.json()).error;
      }
      clearSearch();
      load();
    }

    function clearSearch() {
      searchTable.hidden = true;
      searchRows.innerHTML = '';
      searchError.textContent = '';
    }

    document.getElementById('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      errorEl.textContent = '';
      const f = new FormData(ev.target);
      const body = {
        description: f.get('description'),
        category: f.get('category'),
        amount: f.get('amount'),
      };
      if (f.get('date')) body.date = f.get('date');
      const res = await fetch('/api/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        errorEl.textContent = (await res.json()).error;
        return;
      }
      ev.target.reset();
      load();
    });

    document.getElementById('search-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      clearSearch();
      const id = document.getElementById('search-id').value.trim();
      const res = await fetch('/api/expenses/' + encodeURIComponent(id));
      const data = await res.json();
      if (!res.ok) {
        searchError.textContent = data.error;
        return;
      }
      searchRows.appendChild(buildRow(data));
      searchTable.hidden = false;
    });

    document.getElementById('clear-search').addEventListener('click', () => {
      document.getElementById('search-id').value = '';
      clearSearch();
    });

    load();
  </script>
</body>
</html>
